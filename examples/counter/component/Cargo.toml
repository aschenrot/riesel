[package]
name = "riesel_counter_component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
riesel_counter.workspace = true
riesel_app.workspace = true
riesel_macros.workspace = true
riesel_protocol.workspace = true
riesel_schema.workspace = true

[features]
default = []
async-tcp = ["riesel_app/async-tcp", "riesel_protocol/async-tcp"]

[dev-dependencies]
riesel = { workspace = true, features = ["async-tcp"] }
tokio.workspace = true

[[bin]]
name = "async_counter_service"
path = "src/bin/async_counter_service.rs"
required-features = ["async-tcp"]

[[bin]]
name = "async_counter_crash_fixture"
path = "src/bin/async_counter_crash_fixture.rs"
required-features = ["async-tcp"]

[[bin]]
name = "async_blocking_counter_service"
path = "src/bin/async_blocking_counter_service.rs"
required-features = ["async-tcp"]

[[bin]]
name = "async_blocking_shutdown_fixture"
path = "src/bin/async_blocking_shutdown_fixture.rs"
required-features = ["async-tcp"]
