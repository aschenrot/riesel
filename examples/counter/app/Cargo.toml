[package]
name = "riesel_counter_example"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Test-only internal session publication; no general external client API.
internal-publication = ["riesel/internal-publication"]
# Independent T1 local read-only Counter example, no GUI or Manager dependency.
t1-public-read = ["riesel/app-publication-unix", "dep:riesel_schema", "dep:thiserror"]

[dependencies]
riesel = { workspace = true, features = ["async-tcp"] }
riesel_counter.workspace = true
riesel_counter_component = { workspace = true, features = ["async-tcp"] }
riesel_protocol = { workspace = true, features = ["async-tcp"] }
serde_json.workspace = true
serde.workspace = true
riesel_schema = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.23"
tokio.workspace = true

# Research-only application/interface fixture. These are not released app APIs.
[[bin]]
name = "counter_public_facade_host"
path = "tests/fixtures/counter_public_facade_host.rs"

[[bin]]
name = "counter_resolved_facade_host"
path = "tests/fixtures/counter_resolved_facade_host.rs"

[[bin]]
name = "counter_public_facade_client"
path = "tests/fixtures/counter_public_facade_client.rs"

[[bin]]
name = "counter_crash_fixture"
path = "tests/fixtures/counter_crash_fixture.rs"

[[bin]]
name = "counter_recovery_client"
path = "tests/fixtures/counter_recovery_client.rs"

# Feature-gated real async Counter crash/recovery verification.
# No client auth, public exporter, listener or production publication API.
[[bin]]
name = "counter_async_publication_recovery"
path = "tests/fixtures/counter_async_publication_recovery.rs"
required-features = ["internal-publication"]

[[bin]]
name = "counter_dual_client"
path = "tests/fixtures/counter_dual_client.rs"

[[bin]]
name = "counter_macro"
path = "src/bin/counter_macro.rs"

[[bin]]
name = "counter_macro_managed_service"
path = "src/bin/counter_macro_managed_service.rs"

[[bin]]
name = "counter_macro_alias"
path = "src/bin/counter_macro_alias.rs"

[[bin]]
name = "counter_macro_remote"
path = "src/bin/counter_macro_remote.rs"

[[bin]]
name = "counter_macro_catalog"
path = "src/bin/counter_macro_catalog.rs"

[[bin]]
name = "counter_macro_module"
path = "src/bin/counter_macro_module.rs"

[[bin]]
name = "counter_macro_lifecycle"
path = "src/bin/counter_macro_lifecycle.rs"
