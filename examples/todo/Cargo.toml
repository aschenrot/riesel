[package]
name = "todo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
http = ["dep:axum", "dep:tokio", "dep:tower-http"]
# CI-only seed utility, never included in normal release binaries.
e2e-fixture = []
# Test-only #158 semantics; never enabled by normal HTTP builds.
internal-observation = ["riesel/internal-publication"]
# Opt-in non-sensitive T1 demonstration; never enabled by the Todo CLI/HTTP.
t1-public-read = ["riesel/app-publication-unix", "dep:tokio", "dep:riesel_protocol", "dep:riesel_schema"]

[dependencies]
riesel = { workspace = true, features = ["dev-memory-storage", "sqlite-storage", "async-tcp"] }
thiserror.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
riesel_protocol = { workspace = true, features = ["async-tcp"], optional = true }
riesel_schema = { workspace = true, optional = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
tokio = { workspace = true, features = ["signal", "macros"], optional = true }
tower-http = { version = "=0.6.11", default-features = false, features = ["fs"], optional = true }

[dev-dependencies]
riesel_storage_component = { path = "../../packages/storage/memory" }
tempfile = "3.23"
[[bin]]
name = "todo_macro"
path = "src/bin/todo_macro.rs"

[[bin]]
name = "todo_cli"
path = "src/bin/todo_cli.rs"

[[bin]]
name = "todo_http"
path = "src/bin/todo_http.rs"
required-features = ["http"]

[[bin]]
name = "todo_seed_status"
path = "src/bin/todo_seed_status.rs"
required-features = ["e2e-fixture"]
