[package]
name = "todo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
http = ["dep:axum", "dep:tokio", "dep:tower-http"]

[dependencies]
riesel = { workspace = true, features = ["dev-memory-storage", "sqlite-storage", "async-tcp"] }
thiserror.workspace = true
uuid.workspace = true
serde.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
tokio = { workspace = true, features = ["signal", "macros"], optional = true }
tower-http = { version = "=0.6.11", default-features = false, features = ["fs"], optional = true }

[dev-dependencies]
riesel_schema.workspace = true
riesel_storage_component = { path = "../../packages/storage/memory" }
serde_json.workspace = true
tempfile = "3.23"
[[bin]]
name = "todo_macro"
path = "src/bin/todo_macro.rs"

[[bin]]
name = "todo_cli"
path = "src/bin/todo_cli.rs"

[[bin]]
name = "todo_http"
path = "src/bin/todo_http.rs"
required-features = ["http"]
