[package]
name = "todo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
riesel = { workspace = true, features = ["dev-memory-storage", "sqlite-storage", "async-tcp"] }
thiserror.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[dev-dependencies]
riesel_storage_component = { path = "../../packages/storage/memory" }
serde_json.workspace = true
tempfile = "3.23"
[[bin]]
name = "todo_macro"
path = "src/bin/todo_macro.rs"

[[bin]]
name = "todo_http"
path = "src/bin/todo_http.rs"

[[bin]]
name = "todo_cli"
path = "src/bin/todo_cli.rs"
