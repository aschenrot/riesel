[package]
name = "riesel-grid-workbench-headless"
version = "0.0.0"
edition = "2024"
publish = false

# This is a separate Cargo application, not a mandatory Riesel workspace crate.
[workspace]

[dependencies]
riesel = { path = "../../crates/riesel", features = ["experimental-typed-dataflow"] }
grid_generation = { git = "https://github.com/aschenrot/grid", rev = "7a1a803eff6c34243873b656b739c589a3ce4606" }
grid_math = { git = "https://github.com/aschenrot/grid", rev = "7a1a803eff6c34243873b656b739c589a3ce4606" }
grid_storage = { git = "https://github.com/aschenrot/grid", rev = "7a1a803eff6c34243873b656b739c589a3ce4606" }
tile_topology = { git = "https://github.com/aschenrot/grid", rev = "7a1a803eff6c34243873b656b739c589a3ce4606" }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
