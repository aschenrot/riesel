[package]
name = "riesel-scheduler-research"
version = "0.0.0"
edition = "2024"
publish = false

# Intentionally isolated: not a new production Riesel crate or accepted API.
[workspace]

[dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time"] }

# These are used only in research tests; do not link them into the runner library.
[dev-dependencies]
riesel = { path = "../../crates/riesel", features = ["async-tcp"] }
riesel_counter = { path = "../../examples/counter/contract" }
riesel_counter_component = { path = "../../examples/counter/component", features = ["async-tcp"] }

# Research-only external ECS reference, exact pinned public repository revision.
# GPL-3.0-only: no Riesel production adoption or redistribution is authorized.
runen_ecs = { package = "runen-ecs", git = "https://github.com/dornglut/runen-ecs", rev = "5d6af86bfa7c58f1ad26ec73635590a72e89ef37" }

# Exact published standalone ECS; this does NOT pull in Bevy's app/renderer.
# Serial reference and feature-gated system debugger are compared separately.
bevy_ecs = { version = "=0.20.1", default-features = false, features = ["std", "bevy_debug_stepping", "multi_threaded"] }

# The standalone Bevy ECS multi-threaded executor requires a global CPU task pool.
# This is configured with exactly 4 threads in the isolated comparator fixture.
bevy_tasks = { version = "=0.20.1", default-features = false, features = ["multi_threaded"] }

# Custom harness: standalone release sampling, semantic oracle before accepting data.
[[bench]]
name = "ecs_scaling"
harness = false
