[package]
name = "riesel_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
async-tcp = ["riesel_protocol/async-tcp", "dep:tokio"]
# Test-only crash child; normal application builds never include this executable.
test-fixtures = ["async-tcp"]

[dependencies]
tokio = { workspace = true, optional = true }
riesel_schema.workspace = true
riesel_protocol.workspace = true
riesel_manager.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[[bin]]
name = "managed_graph_child"
path = "tests/fixtures/managed_graph_child.rs"
required-features = ["test-fixtures"]
