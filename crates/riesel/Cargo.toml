[package]
name = "riesel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
records = ["dep:riesel_storage"]
dev-memory-storage = ["records", "dep:riesel_storage_component"]
async-tcp = ["riesel_protocol/async-tcp"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
riesel_storage_component = { path = "../../packages/storage/memory", optional = true }
riesel_app.workspace = true
riesel_macros.workspace = true
riesel_protocol.workspace = true
riesel_schema.workspace = true
riesel_storage = { workspace = true, optional = true }