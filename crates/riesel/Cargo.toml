[package]
name = "riesel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
records = ["dep:riesel_storage"]
dev-memory-storage = ["records", "dep:riesel_storage_component"]
sqlite-storage = ["records", "dep:riesel_storage_sqlite"]
async-tcp = ["riesel_protocol/async-tcp", "riesel_app/async-tcp", "dep:tokio"]
# Intentionally unstable test-only adapter, not the accepted #60 exporter API.
internal-publication = ["async-tcp", "riesel_protocol/internal-publication", "riesel_app/internal-publication"]
# Reusable opt-in T1 read policy, separate from transports and rendering.
app-publication = ["async-tcp", "riesel_app/app-publication"]
# Optional Unix-native transport, never required for browser/Bevy/custom hosts.
app-publication-unix = ["app-publication", "riesel_app/app-publication-unix"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
riesel_storage_component = { path = "../../packages/storage/memory", optional = true }
riesel_storage_sqlite = { path = "../../packages/storage/sqlite", optional = true }
riesel_app.workspace = true
riesel_macros.workspace = true
riesel_protocol.workspace = true
riesel_schema.workspace = true
riesel_storage = { workspace = true, optional = true }
[[example]]
name = "execution_graph"
required-features = ["async-tcp"]

[[example]]
name = "execution_fixed_step"
required-features = ["async-tcp"]

[[example]]
name = "execution_control"
required-features = ["async-tcp"]

[dev-dependencies]
tempfile = "3.23"
# Research-only multi-worker scheduler fixture; no production Tokio feature change.
tokio = { workspace = true, features = ["rt-multi-thread"] }


[[example]]
name = "graph_read_host"
required-features = ["app-publication-unix"]
