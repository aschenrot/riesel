[package]
name = "riesel_storage_sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
riesel_storage.workspace = true
riesel_schema.workspace = true
riesel_app.workspace = true
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.23"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
