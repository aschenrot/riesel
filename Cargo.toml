[workspace]
resolver = "3"
members = [
  "examples/hello",
  "examples/sqlite-maintenance",
  "examples/todo",
  "examples/counter/app",
  "packages/storage/memory",
  "packages/storage/sqlite",
  "examples/counter/component",
  "crates/riesel",
  "examples/counter/contract",
  "crates/riesel_app",
  "crates/riesel_macros",
  "crates/riesel_manager",
  "crates/riesel_protocol",
  "crates/riesel_schema", "packages/storage/contract",
  "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/aschenrot/riesel"

[workspace.dependencies]
riesel = { path = "crates/riesel" }
riesel_counter = { path = "examples/counter/contract" }
riesel_counter_component = { path = "examples/counter/component" }
riesel_app = { path = "crates/riesel_app" }
riesel_macros = { path = "crates/riesel_macros" }
riesel_manager = { path = "crates/riesel_manager" }
riesel_protocol = { path = "crates/riesel_protocol" }
riesel_schema = { path = "crates/riesel_schema" }
riesel_storage = { path = "packages/storage/contract" }

thiserror = "2.0.21"
tokio = { version = "=1.54.1", features = ["io-util", "net", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
