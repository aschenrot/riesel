[workspace]
resolver = "3"
members = [
  "apps/examples/simple_app",
  "apps/examples/todo", "components/storage",
  "crates/riesel",
  "crates/riesel_app",
  "crates/riesel_macros",
  "crates/riesel_manager",
  "crates/riesel_protocol",
  "crates/riesel_schema", "crates/riesel_storage",
  "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/aschenrot/riesel"

[workspace.dependencies]
riesel = { path = "crates/riesel" }
riesel_app = { path = "crates/riesel_app" }
riesel_macros = { path = "crates/riesel_macros" }
riesel_manager = { path = "crates/riesel_manager" }
riesel_protocol = { path = "crates/riesel_protocol" }
riesel_schema = { path = "crates/riesel_schema" }
riesel_storage = { path = "crates/riesel_storage" }

thiserror = "2.0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
