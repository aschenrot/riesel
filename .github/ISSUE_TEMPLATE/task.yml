name: Engineering task
description: Implement an accepted, independently verifiable outcome.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: "Implement accepted scope. Link an existing specification decision when relevant; unresolved architectural questions belong in the Specification / investigation form."
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What accepted behavior or improvement is needed and why?
      placeholder: "The user or developer can..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Define the intended boundary; call out material exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results and how they will be verified.
      placeholder: |
        - [ ] Behavior is covered by relevant tests.
        - [ ] Documentation reflects the implemented contract.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, risks, or decisions
      description: Link the accepted specification/decision if one was required; include material blockers only.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and related work
      description: Link relevant tests, documents, issues or PRs when known.
    validations:
      required: false
