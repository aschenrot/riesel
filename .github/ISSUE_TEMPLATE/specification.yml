name: Specification / investigation
description: Investigate a bounded requirement or architecture question before accepting implementation scope.
title: "[Spec] "
body:
  - type: markdown
    attributes:
      value: "Use for material unresolved questions, not implementation. Before closure, add a comment recording the accept/defer/reject decision, rationale, evidence, and links to any updated product/architecture documents or follow-up Issues."
  - type: textarea
    id: question
    attributes:
      label: Outcome or decision needed
      description: What question must be resolved, for which product goal, and why now?
      placeholder: "Decide the durability and compatibility guarantees for Riesel Record Storage."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Investigation scope and constraints
      description: Specify the boundaries, known requirements, relevant quality attributes, and exclusions. Distinguish facts from assumptions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Research approach and alternatives (when needed)
      description: For a material choice, outline how to discover candidates, screen them against required guarantees, compare viable options on consistent criteria, and obtain evidence. Include unknowns; do not preselect a winner.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Specification acceptance criteria
      description: What must be clear to make and record an accept/defer/reject decision? Include testable boundaries.
      placeholder: |
        - [ ] Material options and trade-offs are evaluated.
        - [ ] Requirements, exclusions, and verification criteria are explicit.
        - [ ] Decision and links to updated authoritative documents are recorded.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link relevant products, contracts, Issues or known blockers.
    validations:
      required: false
