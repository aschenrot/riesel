name: Specification / investigation
description: Investigate a bounded requirement or architecture question before accepting implementation scope.
title: "[Spec] "
body:
  - type: markdown
    attributes:
      value: "Use for material unresolved questions, not implementation. Before closure, add a comment recording the accept/defer/reject decision, rationale, evidence, and links to any updated product/architecture documents or follow-up Issues."
  - type: textarea
    id: question
    attributes:
      label: Outcome or decision needed
      description: What question must be resolved, for which product goal and users, and why now? State application-specific versus shared-platform scope.
      placeholder: "Decide the durability and compatibility guarantees for Riesel Record Storage."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Investigation scope and constraints
      description: Specify the proposed product outcome, reuse boundary, credible future scenarios, quality attributes and exclusions. Do not shrink a platform requirement to one example or treat unaccepted scope as accepted.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Research approach and alternatives (when needed)
      description: Compare existing mechanisms and strategic shared foundations against the full outcome and credible growth. Higher upfront effort is acceptable when it reduces long-term duplication, migration or risk; challenge speculative abstractions too. Use common criteria and a stopping rule.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Specification acceptance criteria
      description: What must be clear to make and record an accept/defer/reject decision? Would passing all tests meet the original product outcome and intended reuse boundary?
      placeholder: |
        - [ ] Material options and trade-offs are evaluated.
        - [ ] Requirements, exclusions, and verification criteria are explicit.
        - [ ] Decision and links to updated authoritative documents are recorded.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link relevant products, contracts, Issues or known blockers.
    validations:
      required: false
