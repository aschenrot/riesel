name: Bug report
description: Report incorrect or regressed Riesel behavior.
title: "[Bug] "
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the exact error when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the observable behavior that should occur.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal example, command, inputs, or regression test.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Revision and environment
      description: Commit SHA, operating system, toolchain and feature flags, if relevant.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact and evidence
      description: Affected contracts or deployments, logs, related issues, or CI runs.
    validations:
      required: false
