name: Todo Web

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "examples/todo/web/**"
      - ".github/workflows/todo-web.yml"
  push:
    branches:
      - main
    paths:
      - "examples/todo/web/**"
      - ".github/workflows/todo-web.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/todo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check frontend types and components
        run: npm run check
      - name: Test HTTP client
        run: npm test
      - name: Build static assets
        run: npm run build
