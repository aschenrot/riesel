name: Todo Web

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "examples/todo/web/**"
      - ".github/workflows/todo-web.yml"
  push:
    branches:
      - main
    paths:
      - "examples/todo/web/**"
      - ".github/workflows/todo-web.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/todo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and inspect frontend dependency lock (temporary)
        run: |
          npm install --package-lock-only --no-audit --no-fund
          echo "TODO_WEB_LOCK_START"
          base64 -w0 package-lock.json
          echo
          echo "TODO_WEB_LOCK_END"
      - name: Verify SvelteKit frontend
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
