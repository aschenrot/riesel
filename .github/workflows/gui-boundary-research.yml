name: GUI boundary research (#248)

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/riesel/examples/execution_graph_inspection_export.rs"
      - "crates/riesel/Cargo.toml"
      - "research/gui-boundary/**"
      - ".github/workflows/gui-boundary-research.yml"

jobs:
  actual-graph-and-independent-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Execute real headless graph and export an immutable read model
        run: |
          cargo run --locked -p riesel --features async-tcp --example execution_graph_inspection_export -- "$RUNNER_TEMP/graph.json"
          python3 research/gui-boundary/verify.py "$RUNNER_TEMP/graph.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reuse existing locked Playwright dependency
        working-directory: examples/todo/web
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium
        working-directory: examples/todo/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Verify independent real browser interaction and screenshot
        env:
          GUI_SCREENSHOT: /tmp/gui-boundary-inspector.png
        run: node research/gui-boundary/browser-test.mjs "$RUNNER_TEMP/graph.json"
      - name: Verify real live graph and independent browser reconnection
        env:
          GUI_LIVE_SCREENSHOT: /tmp/gui-boundary-live.png
        run: |
          target/debug/examples/execution_graph_inspection_export --live 15 > "$RUNNER_TEMP/live.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          node research/gui-boundary/live-browser-test.mjs "$RUNNER_TEMP/live.log" || { cat "$RUNNER_TEMP/live.log"; exit 1; }
          wait "$app_pid"
          trap - EXIT
      - name: Retain actual rendered GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gui-boundary-research-inspector
          path: |
            /tmp/gui-boundary-inspector.png
            /tmp/gui-boundary-live.png
          retention-days: 14
          if-no-files-found: error
