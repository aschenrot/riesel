name: Temporary Todo HTTP research formatting and lock

on:
  pull_request:
    paths:
      - "examples/todo/**"
      - "tools/xtask/src/validate.rs"
      - ".github/workflows/todo-http-research.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          rustup default 1.100.0
      - name: Generate lockfile and format changed Rust files
        run: |
          cargo generate-lockfile
          cargo fmt --all
          for file in Cargo.lock examples/todo/src/lib.rs examples/todo/src/task.rs examples/todo/src/http/mod.rs examples/todo/src/http/security.rs examples/todo/src/http/routes.rs examples/todo/src/bin/todo_http.rs examples/todo/tests/http.rs tools/xtask/src/validate.rs; do
            echo "FORMATTED_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_FILE_END:$file"
          done
      - name: Compile and run local HTTP integration tests
        run: cargo test --locked -p todo --features http --test http -- --nocapture
