name: Temporary Todo static-host dependency and format verification

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "examples/todo/**"
      - ".github/workflows/todo-assets-research.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          rustup default 1.100.0
      - name: Capture dependency lock and formatted files
        run: |
          cargo generate-lockfile
          cargo fmt --all
          for file in Cargo.lock examples/todo/src/http/mod.rs examples/todo/src/http/assets.rs examples/todo/src/bin/todo_http.rs examples/todo/tests/http.rs; do
            echo "TODO_ASSETS_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "TODO_ASSETS_FILE_END:$file"
          done
      - name: Compile Todo HTTP and static-host tests
        run: cargo test --locked -p todo --features http
