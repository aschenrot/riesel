name: Todo Status Research

# This scoped job records empirical scan work on real linked SQLite, without
# expanding the production API or the published Storage v2 contract.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "examples/todo/tests/status_pagination_research.rs"
      - "examples/todo/tests/query_capability_research.rs"
      - "examples/todo/Cargo.toml"
      - "docs/product/todo/status-query-research.md"
      - ".github/workflows/todo-status-research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Measure real Todo memory/SQLite bounded scans
        run: |
          cargo test --locked -p todo --test status_pagination_research -- --nocapture
          cargo test --locked -p todo --test query_capability_research -- --nocapture
