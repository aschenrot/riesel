name: Temporary Todo Web E2E lockfile verification

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "examples/todo/web/**"
      - ".github/workflows/todo-web-e2e-probe.yml"

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/todo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture Playwright dependency lock
        run: |
          npm install --package-lock-only --no-audit --no-fund
          echo "TODO_E2E_LOCK_START"
          base64 -w0 package-lock.json
          echo
          echo "TODO_E2E_LOCK_END"
      - name: Verify browser sources and client tests
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build
