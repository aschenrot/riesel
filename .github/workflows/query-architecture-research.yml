name: Query Architecture Research

on:
  pull_request:
    paths:
      - "research/query-architecture/**"
      - ".github/workflows/query-architecture-research.yml"
  workflow_dispatch:

jobs:
  sqlite-live-keyset-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce scratch-only live keyset continuity counterexamples
        run: python3 research/query-architecture/probes/sqlite_live_keyset.py
      - name: Measure scratch sparse-query execution work and enforce budget rejection
        run: python3 research/query-architecture/probes/sqlite_cost_budget.py
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Verify research-only semantic predicate and cursor contract on real providers
        run: cargo test -p todo --test query_architecture_research -- --nocapture
      - name: Verify split versus coexposed linked provider bindings
        run: cargo test -p todo --test query_instance_binding_research -- --nocapture
      - name: Verify SQLite native JSON expression, indexed lookup and cooperative interruption on provider-authored data
        run: cargo test -p riesel_storage_sqlite --test query_architecture_research -- --nocapture
