name: Research #59 — real logind session-bound protected Riesel owner

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/manager-protected-session-owner-research.yml"
      - "research/process-ownership/manager_session_bound_owner_probe.py"
      - "research/process-ownership/PROTECTED-SESSION-OWNER.md"
  workflow_dispatch:

jobs:
  real-logind-bound-vs-machine:
    name: Actual PAM/logind session, two Riesel OS owners and logout lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify Linux session/OS-owner prerequisites
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test "$(ps -p 1 -o comm=)" = systemd
          command -v loginctl
          command -v systemd-run
          command -v useradd
          command -v userdel
          command -v setpriv
          sudo -n true
          sudo -n systemctl --system show --property=Version --value
          python3 -m py_compile research/process-ownership/manager_session_bound_owner_probe.py
      - name: Build exact unmodified real Riesel Counter source
        env:
          PINNED_SHA: 5201e61cc74bab778dfc63a3788f1708b2530f21
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          git fetch --no-tags --depth=1 origin refs/pull/90/head
          test "$(git rev-parse FETCH_HEAD)" = "$PINNED_SHA"
          git worktree add --detach "$RUNNER_TEMP/pinned-riesel-pr90" "$PINNED_SHA"
          echo "PINNED_COUNTER_ROOT=$RUNNER_TEMP/pinned-riesel-pr90" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/pinned-riesel-pr90"
          cargo build --locked -p riesel_counter_example --bin counter_resolved_facade_host
      - name: Observe actual logind session and exact bound versus unbound protected Counter
        run: |
          set -euo pipefail
          timeout 150 python3 research/process-ownership/manager_session_bound_owner_probe.py --exercise "$PINNED_COUNTER_ROOT"
