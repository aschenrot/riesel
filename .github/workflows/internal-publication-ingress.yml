name: Runtime session ingress (#157) research verification

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/riesel_protocol/**"
      - "crates/riesel_app/**"
      - "crates/riesel_manager/**"
      - "crates/riesel/src/application/context.rs"
      - "crates/riesel/Cargo.toml"
      - "examples/counter/app/**"
      - "examples/todo/Cargo.toml"
      - "examples/todo/src/http/mod.rs"
      - "examples/todo/tests/http.rs"
      - "research/operational-contract/probe_internal_publication.py"
      - ".github/workflows/internal-publication-ingress.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Verify genuine OS child attempt, owner lifetime and same-key reuse
        run: cargo test --locked -p riesel_manager --features internal-observation
      - name: Internal session generation, admission and finite drain tests
        run: cargo test --locked -p riesel_protocol --features internal-publication
      - name: App-owned async ingress, cancellation, teardown and successor fencing
        run: cargo test --locked -p riesel_app --features internal-publication
      - name: Verify actual Todo adapter outcomes, linked SQLite and handler lifecycle
        run: |
          cargo test --locked -p todo --features http,internal-observation --lib http::tests:: -- --nocapture
      - name: Verify real independent Todo client provenance and stale endpoint
        run: |
          cargo test --locked -p todo --features http --test http independent_client_proves_route_reachability_not_protected_identity_or_stale_session -- --exact --nocapture
      - name: Compile the genuine recovering Riesel Counter
        run: |
          cargo build --locked -p riesel_counter_example --bin counter_crash_fixture
          cargo build --locked -p riesel_counter_example --bin counter_recovery_client --features internal-publication
          cargo build --locked -p riesel_counter_example --bin counter_async_publication_recovery --features internal-publication
      - name: Test real same-PID Counter session replacement and stale-effect rejection
        run: python3 research/operational-contract/probe_internal_publication.py
