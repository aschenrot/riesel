name: Validate

# Repository validation needs read-only source access.
permissions:
  contents: read

# Superseded PR runs can be cancelled; push and manually requested release checks are retained.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows:
        description: "Also validate Windows (required before release)"
        type: boolean
        required: false
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      # Run branch-specific research first for fast failure feedback; the
      # normal workspace validation and smoke gates remain mandatory below.
      # No research-only dependency enters default main CI.
      # Temporary, research-branch-only resolution to review and commit the
      # exact new Bevy comparator graph. Remove this step after pinning it.
      - name: Capture updated Bevy research lockfile
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/146-nested-domain-contract' }}
        run: |
          cargo generate-lockfile --manifest-path research/nested-execution/Cargo.toml
          echo RESEARCH_LOCKFILE_BEGIN
          cat research/nested-execution/Cargo.lock
          echo RESEARCH_LOCKFILE_END
      - name: Verify Issue 146 nested execution research
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/146-nested-domain-contract' }}
        run: |
          cargo fmt --manifest-path research/nested-execution/Cargo.toml -- --check
          cargo clippy --locked --manifest-path research/nested-execution/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path research/nested-execution/Cargo.toml -- --nocapture
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test runtime and managed providers
        run: cargo smoke

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test runtime and managed providers
        run: cargo smoke
