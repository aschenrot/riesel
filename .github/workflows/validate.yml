name: Validate

# Repository validation needs read-only source access.
permissions:
  contents: read

# Superseded PR runs can be cancelled; push and manually requested release checks are retained.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows:
        description: "Also validate Windows (required before release)"
        type: boolean
        required: false
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Validate workspace
        run: cargo validate --check
      - name: V2 production adapter OS-process crash windows (test feature only)
        run: cargo test --locked -p riesel_storage_sqlite --features v2-fault-injection --test v2_process_crash
      - name: V2 verified backup and offline restore
        run: cargo test --locked -p riesel_storage_sqlite --test v2_backup
      - name: V2 explicit backup-checked physical format migration
        run: cargo test --locked -p riesel_storage_sqlite --test v2_format_migration
      - name: V2 installed-build exact-registration rollover
        run: cargo test --locked -p riesel_storage_sqlite --test v2_registration_rollover
      - name: V2 distinct compiled app artifacts and process-level upgrade
        run: |
          cargo build --locked -p riesel_storage_sqlite --example v2_artifact_old --example v2_artifact_rejected --example v2_artifact_new
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          target/debug/examples/v2_artifact_old "$scratch/plans.sqlite" "$scratch/old-backup.sqlite"
          target/debug/examples/v2_artifact_rejected "$scratch/plans.sqlite" "$scratch/old-backup.sqlite"
          target/debug/examples/v2_artifact_new "$scratch/plans.sqlite" "$scratch/old-backup.sqlite"
      - name: Smoke test runtime and managed providers
        run: cargo smoke
      - name: Research #226 mixed resource and control admission (draft only)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/226-mixed-resource-and-control' }}
        run: cargo test -p riesel --features async-tcp --test scheduler_mixed_resource_research -- --nocapture --test-threads=1
      - name: Research #226 optimized mixed resource and control admission (draft only)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/226-mixed-resource-and-control' }}
        run: cargo test -p riesel --release --features async-tcp --test scheduler_mixed_resource_research -- --nocapture --test-threads=1

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test runtime and managed providers
        run: cargo smoke
