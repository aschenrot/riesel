name: Validate

# Repository validation needs read-only source access.
permissions:
  contents: read

# Superseded PR runs can be cancelled; push and manually requested release checks are retained.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows:
        description: "Also validate Windows (required before release)"
        type: boolean
        required: false
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test runtime and managed providers
        run: cargo smoke
      # The isolated research-only RunenECS dependency is pinned to an exact
      # public Git commit and must be fetched at least once; normal workspace
      # validation and smoke gates above remain unchanged.
      - name: Execute Issue 83 isolated research probes
        # Keep external research-only Git dependencies out of regular main/PR CI.
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/83-scheduler-research' }}
        run: cargo test --manifest-path research/execution-scheduler/Cargo.toml -- --nocapture
      - name: Compare Issue 83 ECS release-profile performance (exploratory)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/83-scheduler-research' }}
        run: |
          rustc --version
          cargo bench --manifest-path research/execution-scheduler/Cargo.toml --bench ecs_scaling


  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test runtime and managed providers
        run: cargo smoke
