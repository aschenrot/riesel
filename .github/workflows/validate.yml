name: Validate

# Repository validation needs read-only source access.
permissions:
  contents: read

# Superseded PR runs can be cancelled; push and manually requested release checks are retained.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows:
        description: "Also validate Windows (required before release)"
        type: boolean
        required: false
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      # Temporary development probe: remove after committing generated Cargo.lock and rustfmt results.
      - name: Resolve lockfile and format research branch
        run: |
          cargo generate-lockfile
          echo 'RIESEL_LOCKFILE_START'
          base64 -w0 Cargo.lock
          echo
          echo 'RIESEL_LOCKFILE_END'
          cargo fmt --all
          echo 'RIESEL_FORMAT_DIFF_START'
          git diff -- examples/todo/src examples/todo/tests
          echo 'RIESEL_FORMAT_DIFF_END'
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test runtime and managed providers
        run: cargo smoke

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test runtime and managed providers
        run: cargo smoke
