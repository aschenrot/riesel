name: Validate

on:
  push:
    branches:
      - feature/schema_based_app
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Validate workspace
        run: cargo validate --check
      - name: Smoke test remote Todo and managed service
        run: cargo smoke
